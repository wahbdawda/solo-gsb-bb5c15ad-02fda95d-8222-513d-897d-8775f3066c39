services:
  api:
    build: .
    image: instrument-ingestion:latest
    container_name: instrument-ingestion
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/measurements.db
      DEFAULT_START_SEQ: "1"
      MAX_BATCH_SIZE: "1000"
    volumes:
      - instrument-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  instrument-data:
    driver: local
